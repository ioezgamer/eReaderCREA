name: Android APK

on:
  workflow_dispatch:
  push:
    branches: ['ci/android-apk-build-once-20261015']
    tags: ['android-v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        run: |
          SDKMGR="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMGR" ]; then echo "sdkmanager no encontrado"; exit 1; fi
          yes | "$SDKMGR" --licenses >/dev/null || true
          echo "Paquetes SDK Android 37 disponibles:"
          "$SDKMGR" --list --channel=3 | grep -E 'platforms;android-(37|36)' | head -n 20 || true
          "$SDKMGR" --channel=3 "platforms;android-37"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restaurar clave de depuración (para Drive/OAuth)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::Sin DEBUG_KEYSTORE_BASE64: la firma será distinta y Drive no funcionará."
          fi

      - name: Leer versión
        id: v
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PsignWithDebugKey -PaiBaseUrl="${{ vars.AI_BASE_URL }}"

      - name: Preparar archivos
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/CREA-Reader-${{ steps.v.outputs.version }}.apk"
          cd dist && sha256sum *.apk > SHA256SUMS.txt
          {
            echo "### CREA Reader ${{ steps.v.outputs.version }}"
            cat SHA256SUMS.txt
            echo "SHA-1 de firma:"
            keytool -printcert -jarfile *.apk | grep 'SHA1:'
            echo "(esperado: AF:35:20:BD:BB:0F:59:C5:A3:9C:65:B5:13:C3:9F:E9:B4:CB:D5:1B)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: CREA-Reader-${{ steps.v.outputs.version }}
          path: dist/*

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v${{ steps.v.outputs.version }}"
          NOTES=$(awk -v v="## ${{ steps.v.outputs.version }} " 'index($0,v)==1{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "${{ github.sha }}" \
              --title "CREA Reader ${{ steps.v.outputs.version }} (Android)" --notes "$NOTES"
          fi
