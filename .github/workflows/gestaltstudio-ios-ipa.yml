name: GestaltStudio iOS unsigned IPA
on:
  push:
    branches:
      - experiments/gestaltstudio-ipa
  pull_request:
    branches:
      - main
    paths:
      - experiments/GestaltStudio/**
      - .github/workflows/gestaltstudio-ios-ipa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
      - name: Build GestaltStudio using Xcode
        shell: bash
        run: bash experiments/GestaltStudio/gestaltstudio_build.sh
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: GestaltStudio-unsigned-IPA
          path: GestaltStudio-unsigned.ipa
          if-no-files-found: error
