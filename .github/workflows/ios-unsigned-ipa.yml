name: iOS unsigned IPA (FlareStore)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/ios-flarestore
    paths:
      - 'ios/**'
      - '.github/workflows/ios-unsigned-ipa.yml'
concurrency:
  group: ios-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate iOS AppIcon assets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import subprocess
          root = Path("ios/CREAReader/Assets.xcassets/AppIcon.appiconset")
          source = Path("ios/IconSource.png")
          assert source.is_file(), "Missing official CREA Reader icon"
          records = json.loads((root / "Contents.json").read_text())["images"]
          for icon in records:
              size = int(round(float(icon["size"].split("x")[0]) * float(icon["scale"].rstrip("x"))))
              subprocess.run(
                  ["sips", "-s", "format", "png", "-z", str(size), str(size),
                   str(source), "--out", str(root / icon["filename"])],
                  stdout=subprocess.DEVNULL, check=True
              )
          print(f"Created {len(records)} AppIcon PNG images for iPhone and iPad")
          PY
      - name: Generate project
        run: |
          cd ios
          xcodegen generate
      - name: Swift syntax check
        run: xcrun swiftc -frontend -parse ios/CREAReader/*.swift
      - name: Build for physical iOS devices without signing
        env:
          GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_IOS_URL_SCHEME: ${{ vars.GOOGLE_IOS_URL_SCHEME }}
        run: |
          set -o pipefail
          GOOGLE_IOS_CLIENT_ID="${GOOGLE_IOS_CLIENT_ID:-101673121950-e6jb7e03imhbts9dc98em5gof37ebkn8.apps.googleusercontent.com}"
          GOOGLE_IOS_URL_SCHEME="${GOOGLE_IOS_URL_SCHEME:-com.googleusercontent.apps.101673121950-e6jb7e03imhbts9dc98em5gof37ebkn8}"
          xcodebuild -resolvePackageDependencies -project ios/CREAReader.xcodeproj -scheme CREAReader
          xcodebuild GOOGLE_IOS_CLIENT_ID="$GOOGLE_IOS_CLIENT_ID" GOOGLE_IOS_URL_SCHEME="$GOOGLE_IOS_URL_SCHEME" -project ios/CREAReader.xcodeproj -scheme CREAReader -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/crea-build" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$GITHUB_WORKSPACE/ios-build.log"
      - name: Upload compiler diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-errors
          path: ios-build.log
          if-no-files-found: ignore
      - name: Verify bundled iOS AppIcon
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/crea-build/Build/Products/Release-iphoneos/CREAReader.app"
          test -s "$APP/Assets.car"
          python3 - "$APP/Info.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as source:
              info = plistlib.load(source)
          icon = info.get("CFBundleIcons", {}).get("CFBundlePrimaryIcon", {}).get("CFBundleIconName")
          icon = icon or info.get("CFBundleIconName")
          if icon != "AppIcon":
              raise SystemExit(f"Expected AppIcon in packaged Info.plist, got: {icon!r}")
          print("Confirmed AppIcon is registered in the iPhone app bundle")
          PY
      - name: Package IPA
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$RUNNER_TEMP/crea-build/Build/Products/Release-iphoneos/CREAReader.app" "$RUNNER_TEMP/package/Payload/"
          cd "$RUNNER_TEMP/package"
          zip -qr "$GITHUB_WORKSPACE/CREA-Reader-iOS-0.9.3-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CREA-Reader-iOS-unsigned-IPA
          path: CREA-Reader-iOS-0.9.3-unsigned.ipa
          if-no-files-found: error
      - name: Publish downloadable IPA in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="ios-preview-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "CREA-Reader-iOS-0.9.3-unsigned.ipa" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CREA Reader iOS 0.9.3 beta - prueba ${GITHUB_RUN_NUMBER}" \
            --notes "IPA iOS 0.9.3 sin firmar para FlareStore. Incluye ficha de libro, sinopsis y metadatos reales, muestra EPUB/PDF, lectura temporal en línea y descarga opcional. Mantiene Google Drive y el icono oficial. Requiere firma con FlareStore." \
            --prerelease

      - name: Record successful IPA build on commit
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success \
            -f context=crea-ios-ipa \
            -f description="IPA 0.9.3 beta built and published in Releases" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
      - name: Record failed IPA build on commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SUMMARY="iOS build failed. Open the linked GitHub Actions run."
          if [ -f ios-build.log ]; then
            MATCH="$(grep -m 1 -E 'error:|BUILD FAILED' ios-build.log || true)"
            if [ -n "$MATCH" ]; then
              SUMMARY="${MATCH:0:120}"
            fi
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=failure \
            -f context=crea-ios-ipa \
            -f description="$SUMMARY" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
