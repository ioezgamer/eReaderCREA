name: iOS unsigned IPA (FlareStore)
on:
  workflow_dispatch:
    inputs:
      validated_artifact_id:
        description: 'Optional artifact from a successful iOS parity validation'
        type: string
        required: false
      validated_commit:
        description: 'Full source SHA of that validated artifact'
        type: string
        required: false
  push:
    branches:
      - feature/ios-flarestore
    paths:
      - 'ios/**'
      - '.github/workflows/ios-unsigned-ipa.yml'
concurrency:
  group: ios-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ${{ inputs.validated_artifact_id && 'ubuntu-latest' || 'macos-15-intel' }}
    env:
      VALIDATED_ARTIFACT_ID: ${{ inputs.validated_artifact_id }}
      VALIDATED_COMMIT: ${{ inputs.validated_commit }}
    permissions:
      actions: read
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - name: Import verified device IPA from validation
        if: ${{ inputs.validated_artifact_id }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$VALIDATED_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$VALIDATED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git fetch --depth 1 origin "$VALIDATED_COMMIT"
          git diff --exit-code "$VALIDATED_COMMIT" HEAD -- ios
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$VALIDATED_ARTIFACT_ID" > "$RUNNER_TEMP/validated-metadata.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$VALIDATED_ARTIFACT_ID/zip" > "$RUNNER_TEMP/validated.zip"
          python3 - <<'PY'
          import json, os, pathlib, plistlib, re, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          metadata = json.loads((root / 'validated-metadata.json').read_text())
          assert not metadata['expired']
          assert metadata['workflow_run']['head_sha'] == os.environ['VALIDATED_COMMIT']
          with zipfile.ZipFile(root / 'validated.zip') as archive:
              candidates = [n for n in archive.namelist() if n.endswith('-unsigned.ipa')]
              assert len(candidates) == 1
              tests = archive.read(next(n for n in archive.namelist() if n.endswith('/parity-build.log'))).decode('utf8')
              device = archive.read(next(n for n in archive.namelist() if n.endswith('/parity-device.log'))).decode('utf8')
              assert '** TEST SUCCEEDED **' in tests
              assert re.search(r'Executed \d+ tests, with 0 failures', tests)
              assert '** BUILD SUCCEEDED **' in device
              (root / 'validated.ipa').write_bytes(archive.read(candidates[0]))
          with zipfile.ZipFile(root / 'validated.ipa') as archive:
              assert archive.testzip() is None
              assert all(not pathlib.PurePosixPath(n).is_absolute() and '..' not in pathlib.PurePosixPath(n).parts for n in archive.namelist())
              info = plistlib.loads(archive.read('Payload/CREAReader.app/Info.plist'))
              assert info['CFBundleIdentifier'] == 'org.crea.reader.ios'
              assert info['CFBundleSupportedPlatforms'] == ['iPhoneOS']
              version = re.search(r'MARKETING_VERSION:\s*(\S+)', pathlib.Path('ios/project.yml').read_text()).group(1)
              assert info['CFBundleShortVersionString'] == version
              print('Verified tested device IPA:', version, os.environ['VALIDATED_COMMIT'])
          PY
          unzip -q "$RUNNER_TEMP/validated.ipa" -d "$RUNNER_TEMP/validated-app"
          mkdir -p "$RUNNER_TEMP/crea-build/Build/Products/Release-iphoneos"
          cp -R "$RUNNER_TEMP/validated-app/Payload/CREAReader.app" "$RUNNER_TEMP/crea-build/Build/Products/Release-iphoneos/"
      - name: Select Xcode
        if: ${{ !inputs.validated_artifact_id }}
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Install XcodeGen
        if: ${{ !inputs.validated_artifact_id }}
        run: brew install xcodegen
      - name: Generate iOS AppIcon assets
        if: ${{ !inputs.validated_artifact_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import subprocess
          root = Path("ios/CREAReader/Assets.xcassets/AppIcon.appiconset")
          source = Path("ios/IconSource.png")
          assert source.is_file(), "Missing official CREA Reader icon"
          records = json.loads((root / "Contents.json").read_text())["images"]
          for icon in records:
              size = int(round(float(icon["size"].split("x")[0]) * float(icon["scale"].rstrip("x"))))
              subprocess.run(
                  ["sips", "-s", "format", "png", "-z", str(size), str(size),
                   str(source), "--out", str(root / icon["filename"])],
                  stdout=subprocess.DEVNULL, check=True
              )
          print(f"Created {len(records)} AppIcon PNG images for iPhone and iPad")
          PY
      - name: Generate project
        if: ${{ !inputs.validated_artifact_id }}
        run: |
          cd ios
          xcodegen generate
      - name: Swift syntax check
        if: ${{ !inputs.validated_artifact_id }}
        run: xcrun swiftc -frontend -parse ios/CREAReader/*.swift ios/Shared/*.swift ios/CREAWidgets/*.swift
      - name: Build for physical iOS devices without signing
        if: ${{ !inputs.validated_artifact_id }}
        env:
          GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_IOS_URL_SCHEME: ${{ vars.GOOGLE_IOS_URL_SCHEME }}
        run: |
          set -o pipefail
          GOOGLE_IOS_CLIENT_ID="${GOOGLE_IOS_CLIENT_ID:-101673121950-e6jb7e03imhbts9dc98em5gof37ebkn8.apps.googleusercontent.com}"
          GOOGLE_IOS_URL_SCHEME="${GOOGLE_IOS_URL_SCHEME:-com.googleusercontent.apps.101673121950-e6jb7e03imhbts9dc98em5gof37ebkn8}"
          xcodebuild -resolvePackageDependencies -project ios/CREAReader.xcodeproj -scheme CREAReader
          xcodebuild GOOGLE_IOS_CLIENT_ID="$GOOGLE_IOS_CLIENT_ID" GOOGLE_IOS_URL_SCHEME="$GOOGLE_IOS_URL_SCHEME" -project ios/CREAReader.xcodeproj -scheme CREAReader -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/crea-build" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$GITHUB_WORKSPACE/ios-build.log"
      - name: Upload compiler diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-errors
          path: ios-build.log
          if-no-files-found: ignore
      - name: Verify bundled iOS AppIcon
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/crea-build/Build/Products/Release-iphoneos/CREAReader.app"
          test -s "$APP/Assets.car"
          python3 - "$APP/Info.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as source:
              info = plistlib.load(source)
          icon = info.get("CFBundleIcons", {}).get("CFBundlePrimaryIcon", {}).get("CFBundleIconName")
          icon = icon or info.get("CFBundleIconName")
          if icon != "AppIcon":
              raise SystemExit(f"Expected AppIcon in packaged Info.plist, got: {icon!r}")
          print("Confirmed AppIcon is registered in the iPhone app bundle")
          PY
      - name: Package IPA
        id: ipa
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/crea-build/Build/Products/Release-iphoneos/CREAReader.app"
          VERSION="$(python3 -c 'import plistlib,sys; print(plistlib.load(open(sys.argv[1], "rb"))["CFBundleShortVersionString"])' "$APP/Info.plist")"
          NAME="CREA-Reader-iOS-${VERSION}-unsigned.ipa"
          if [ -n "$VALIDATED_ARTIFACT_ID" ]; then
            cp "$RUNNER_TEMP/validated.ipa" "$GITHUB_WORKSPACE/$NAME"
          else
            mkdir -p "$RUNNER_TEMP/package/Payload"
            cp -R "$APP" "$RUNNER_TEMP/package/Payload/"
            cd "$RUNNER_TEMP/package"
            zip -qr "$GITHUB_WORKSPACE/$NAME" Payload
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          test -s "$GITHUB_WORKSPACE/$NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: CREA-Reader-iOS-unsigned-IPA
          path: ${{ steps.ipa.outputs.name }}
          if-no-files-found: error
      - name: Publish downloadable IPA in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="ios-preview-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "${{ steps.ipa.outputs.name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CREA Reader iOS ${{ steps.ipa.outputs.version }} beta - prueba ${GITHUB_RUN_NUMBER}" \
            --notes "IPA iOS ${{ steps.ipa.outputs.version }} sin firmar para FlareStore. Catálogo y biblioteca con portadas uniformes, tarjetas alineadas, filtros coherentes y adaptación a texto grande. Progreso por dispositivo en la ficha del libro y modos claro/oscuro. Requiere firma con FlareStore." \
            --prerelease

      - name: Build public FlareStore source
        run: |
          set -euo pipefail
          SITE="flarestore-public"
          mkdir -p "$SITE"
          cp "${{ steps.ipa.outputs.name }}" "$SITE/"
          cp ios/IconSource.png "$SITE/icon.png"
          python3 ios/scripts/generate_flarestore_source.py \
            --plist "$RUNNER_TEMP/crea-build/Build/Products/Release-iphoneos/CREAReader.app/Info.plist" \
            --ipa "${{ steps.ipa.outputs.name }}" \
            --output "$SITE/source.json" \
            --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" \
            --notes "CREA Reader iOS ${{ steps.ipa.outputs.version }}: catálogo y biblioteca rediseñados, portadas alineadas, filtros uniformes, modo oscuro y adaptación a texto grande."
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("flarestore-public")
          source=json.loads((root/"source.json").read_text())
          version=source["apps"][0]["versions"][0]["version"]
          (root/"index.html").write_text(
              '<!doctype html><html lang="es"><head><meta charset="utf-8">'
              '<meta name="viewport" content="width=device-width,initial-scale=1">'
              '<meta name="robots" content="noindex">'
              '<title>CREA Reader | FlareStore</title></head>'
              '<body style="font-family:system-ui;max-width:620px;padding:25px;margin:auto">'
              '<img src="icon.png" alt="CREA Reader" width="96" height="96">'
              '<h1>CREA Reader para iOS</h1>'
              '<p>Versión '+version+' · Actualizaciones mediante FlareStore</p>'
              '<p>En FlareStore abre <strong>Repositorios</strong>, agrega esta URL y actualiza la fuente:</p>'
              '<p><code>https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/source.json</code></p>'
              '<p><a href="source.json">Abrir fuente JSON</a></p>'
              '</body></html>', encoding="utf-8")
          PY
          python3 -m json.tool "$SITE/source.json" > /dev/null
          test -s "$SITE/${{ steps.ipa.outputs.name }}"
      - name: Upload FlareStore website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: flarestore-public
      - name: Record successful IPA build on commit
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success \
            -f context=crea-ios-ipa \
            -f description="IPA published; Pages deployment is tracked separately" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
      - name: Record failed IPA build on commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SUMMARY="iOS build failed. Open the linked GitHub Actions run."
          if [ -f ios-build.log ]; then
            MATCH="$(grep -m 1 -E 'error:|BUILD FAILED' ios-build.log || true)"
            if [ -n "$MATCH" ]; then
              SUMMARY="${MATCH:0:120}"
            fi
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=failure \
            -f context=crea-ios-ipa \
            -f description="$SUMMARY" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null

  deploy-flarestore:
    name: Publish FlareStore repo URL
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: flarestore-publish
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Initialize GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy public IPA and source.json to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
