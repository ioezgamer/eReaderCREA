name: iOS unsigned IPA (FlareStore)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/ios-flarestore
    paths:
      - 'ios/**'
      - '.github/workflows/ios-unsigned-ipa.yml'
concurrency:
  group: ios-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: |
          cd ios
          xcodegen generate
      - name: Swift syntax check
        run: xcrun swiftc -frontend -parse ios/CREAReader/*.swift
      - name: Build for physical iOS devices without signing
        env:
          GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_IOS_URL_SCHEME: ${{ vars.GOOGLE_IOS_URL_SCHEME }}
        run: |
          set -o pipefail
          GOOGLE_IOS_CLIENT_ID="${GOOGLE_IOS_CLIENT_ID:-101673121950-e6jb7e03imhbts9dc98em5gof37ebkn8.apps.googleusercontent.com}"
          GOOGLE_IOS_URL_SCHEME="${GOOGLE_IOS_URL_SCHEME:-com.googleusercontent.apps.101673121950-e6jb7e03imhbts9dc98em5gof37ebkn8}"
          xcodebuild -resolvePackageDependencies -project ios/CREAReader.xcodeproj -scheme CREAReader
          xcodebuild GOOGLE_IOS_CLIENT_ID="$GOOGLE_IOS_CLIENT_ID" GOOGLE_IOS_URL_SCHEME="$GOOGLE_IOS_URL_SCHEME" -project ios/CREAReader.xcodeproj -scheme CREAReader -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/crea-build" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$GITHUB_WORKSPACE/ios-build.log"
      - name: Upload compiler diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-errors
          path: ios-build.log
          if-no-files-found: ignore
      - name: Package IPA
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$RUNNER_TEMP/crea-build/Build/Products/Release-iphoneos/CREAReader.app" "$RUNNER_TEMP/package/Payload/"
          cd "$RUNNER_TEMP/package"
          zip -qr "$GITHUB_WORKSPACE/CREA-Reader-iOS-0.9.0-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CREA-Reader-iOS-unsigned-IPA
          path: CREA-Reader-iOS-0.9.0-unsigned.ipa
          if-no-files-found: error
      - name: Publish downloadable IPA in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="ios-preview-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "CREA-Reader-iOS-0.9.0-unsigned.ipa" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CREA Reader iOS - prueba ${GITHUB_RUN_NUMBER}" \
            --notes "IPA experimental sin firmar para FlareStore. EPUB usa Readium Swift; inicio de sesión Google requiere configurar OAuth iOS. Sincronización Drive aún pendiente. Se necesita firma compatible." \
            --prerelease
