name: CREAReader
options:
  bundleIdPrefix: org.crea
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  CREAReader:
    type: application
    platform: iOS
    info:
      path: CREAReader/Info.plist
      properties:
        CFBundleDisplayName: CREA Reader
        UILaunchStoryboardName: LaunchScreen
        GIDClientID: 101673121950-e6jb7e03imhbts9dc98em5gof37ebkn8.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.101673121950-e6jb7e03imhbts9dc98em5gof37ebkn8
    sources:
      - path: CREAReader
    dependencies:
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.crea.reader.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_CFBundleDisplayName: CREA Reader
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 0.9.1
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO

packages:
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    exactVersion: 3.8.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 9.0.0
