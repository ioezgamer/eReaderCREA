# Despliegue gratuito en Render (https://render.com): no pide tarjeta para el plan gratuito.
# La clave de Anthropic NO va aquí: se pega en el panel de Render (variable ANTHROPIC_API_KEY).
services:
  - type: web
    name: crea-reader-ai
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: node src/index.js
    healthCheckPath: /healthz
    envVars:
      # Contadores de gasto y límites: tienen que sobrevivir a los reinicios (el plan gratuito se duerme).
      # Crea una base Redis gratuita en https://upstash.com (sin tarjeta) y pega aquí su URL y token REST.
      # Sin ellos el servidor funciona, pero avisa en el registro de que los topes no son reales.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # ID del cliente OAuth Android de la app (…apps.googleusercontent.com), separados por comas si hay
      # varios (debug, release, Play). Así solo se aceptan tokens emitidos para CREA Reader.
      - key: ALLOWED_AUDIENCES
        sync: false
      - key: ALLOWED_DOMAINS
        value: creanicaragua.org
      - key: MONTHLY_BUDGET_USD
        value: "50"
      - key: USER_DAILY_LIMIT
        value: "300"
      # CREA Aventuras usa una identidad de servicio para todas sus tablets: tope diario propio (además del
      # límite de 30 por tablet y del presupuesto mensual).
      - key: AVENTURAS_DAILY_LIMIT
        value: "5000"
      - key: CREA_AVENTURAS_SERVICE_TOKEN
        sync: false
      # Llave de la app CREA Aventuras para tablets SIN CREA Home (conexion directa). Va dentro del APK, asi
      # que es de bajo privilegio: solo sirve para /v1/aventuras/tutor, con tope diario propio. Sin ella, la
      # conexion directa queda apagada (401).
      - key: CREA_AVENTURAS_APP_TOKEN
        sync: false
      - key: AVENTURAS_APP_DAILY_LIMIT
        value: "1500"
      # Reportes de sugerencias de la IA desde CREA Aventuras (POST /v1/aventuras/tutor/report): por tablet
      # y día, y tope diario de todo el servicio. Se guardan 90 días.
      - key: AVENTURAS_REPORT_DEVICE_LIMIT
        value: "5"
      - key: AVENTURAS_REPORT_DAILY_LIMIT
        value: "200"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_WORKSPACE_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Voz natural (ElevenLabs). La clave se pega en el panel de Render, nunca aquí.
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      # Voces que se pueden elegir en la app: "id=Nombre, id=Nombre".
      - key: ELEVENLABS_VOICES
        sync: false
      # Expresividad: más baja la estabilidad = más expresiva; el estilo exagera la forma de hablar.
      - key: VOICE_STABILITY
        value: "0.4"
      - key: VOICE_STYLE
        value: "0.15"
      - key: VOICE_MONTHLY_CHARS
        value: "400000"
      - key: VOICE_DEVICE_DAILY_CHARS
        value: "60000"
